<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>添加计算指标 · 统一弹窗设计原型</title>
<style>
  :root{
    --primary:#2f6bff; --primary-hover:#1f5af0; --primary-bg:#eaf1ff;
    --text:#1f2329; --text-2:#646a73; --text-3:#9aa0ad;
    --border:#e3e6eb; --border-input:#d4d7de;
    --bg:#f4f6f9; --card:#ffffff;
    --radius:8px; --radius-lg:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:13px;color:var(--text)}

  /* ---------- 背景演示页 ---------- */
  .page{height:100%;display:flex;flex-direction:column}
  .topbar{
    height:52px;background:#fff;border-bottom:1px solid var(--border);
    display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;
  }
  .topbar .logo{width:26px;height:26px;border-radius:6px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .topbar .title{font-weight:600}
  .topbar .crumb{color:var(--text-3);font-size:13px}
  .page-body{padding:24px;flex:1;overflow:auto}
  .panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .panel-head h2{font-size:15px}
  .fake-table{width:100%;border-collapse:collapse;font-size:13px}
  .fake-table th{color:var(--text-2);font-weight:500;text-align:left;padding:10px 12px;background:#f8f9fb;border-bottom:1px solid var(--border)}
  .fake-table td{padding:11px 12px;border-bottom:1px solid #f0f1f4;color:var(--text-2)}
  .tag{display:inline-block;padding:2px 8px;border-radius:4px;background:var(--primary-bg);color:var(--primary);font-size:12px}

  /* ---------- 按钮 ---------- */
  .btn{
    height:34px;padding:0 18px;border-radius:6px;border:1px solid var(--border-input);
    background:#fff;color:var(--text);font-size:13px;transition:all .15s;
  }
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-hover);color:#fff}
  .link-btn{
    border:none;background:none;color:var(--primary);font-size:13px;padding:4px 0;
  }
  .link-btn:hover{text-decoration:underline}
  .icon-btn{
    width:30px;height:34px;border:none;background:none;color:var(--text-3);font-size:16px;border-radius:6px;flex-shrink:0;
  }
  .icon-btn:hover{background:#f2f3f5;color:#e34d59}

  /* ---------- 弹窗 ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:100;
    opacity:0;visibility:hidden;transition:opacity .18s ease;
  }
  .overlay.show{opacity:1;visibility:visible}
  .dialog{
    width:1120px;max-width:94vw;height:760px;max-height:92vh;background:#fff;
    border-radius:14px;box-shadow:0 24px 64px rgba(15,23,42,.22);
    display:flex;flex-direction:column;overflow:hidden;
    transform:translateY(10px) scale(.985);transition:transform .18s ease;
  }
  .overlay.show .dialog{transform:none}
  .dlg-header{
    height:60px;padding:0 20px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:12px;flex-shrink:0;
  }
  .dlg-header h1{font-size:16px;font-weight:600}
  .dlg-header .sub{font-size:12px;color:var(--text-3);border-left:1px solid var(--border);padding-left:12px}
  .dlg-header .close{
    margin-left:auto;width:32px;height:32px;border:none;background:none;border-radius:6px;
    color:var(--text-3);font-size:16px;line-height:1;
  }
  .dlg-header .close:hover{background:#f2f3f5;color:var(--text)}
  .dlg-body{flex:1;display:flex;min-height:0}

  /* 左侧计算方式导航 */
  .aside{
    width:242px;border-right:1px solid var(--border);background:#fafbfc;
    display:flex;flex-direction:column;flex-shrink:0;
  }
  .aside .search{padding:12px;border-bottom:1px solid var(--border)}
  .aside .search input{
    width:100%;height:32px;padding:0 12px;border:1px solid var(--border-input);
    border-radius:6px;background:#fff;outline:none;
  }
  .aside .search input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(47,107,255,.12)}
  .aside nav{flex:1;overflow-y:auto;padding:8px 10px 16px}
  .nav-group{margin-top:10px}
  .nav-group .g-title{font-size:12px;color:var(--text-3);padding:4px 8px 6px}
  .nav-item{
    width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:2px;
    border:none;background:none;border-radius:6px;text-align:left;font-size:13px;color:var(--text);
    border-left:2px solid transparent;transition:background .12s;
  }
  .nav-item:hover{background:#eef2f8}
  .nav-item.active{background:var(--primary-bg);color:var(--primary);border-left-color:var(--primary);font-weight:500}
  .nav-item .no{
    font-size:11px;color:var(--text-3);background:#eef0f3;border-radius:4px;
    min-width:20px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px;flex-shrink:0;
  }
  .nav-item.active .no{background:#fff;color:var(--primary)}
  .nav-item.hidden{display:none}
  .nav-empty{padding:20px;text-align:center;color:var(--text-3);font-size:13px}

  /* 右侧表单区 */
  .main{flex:1;overflow-y:auto;padding:18px 22px 24px;min-width:0}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:18px 20px;margin-bottom:16px;
  }
  .card h3{
    font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:16px;
  }
  .card h3::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--primary)}
  .card h3 .h3-sub{font-size:12px;font-weight:400;color:var(--text-3)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field.full{grid-column:1 / -1;margin-top:14px}
  .field label{font-size:13px;color:var(--text-2)}
  .field label.req::before{content:"* ";color:#e34d59}
  .field input,.field select,.field textarea{
    height:34px;padding:0 10px;border:1px solid var(--border-input);border-radius:6px;
    outline:none;background:#fff;transition:border .12s, box-shadow .12s;width:100%;
  }
  .field textarea{height:auto;padding:8px 10px;resize:vertical;min-height:56px;line-height:1.5}
  .field input:focus,.field select:focus,.field textarea:focus{
    border-color:var(--primary);box-shadow:0 0 0 2px rgba(47,107,255,.12);
  }
  .field .hint{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px}
  .field .hint button{border:none;background:none;color:var(--primary);font-size:12px;padding:0}
  .field .hint button:hover{text-decoration:underline}
  .field.error input{border-color:#e34d59;box-shadow:0 0 0 2px rgba(227,77,89,.12)}

  /* 参数区块 */
  .block{margin-bottom:18px}
  .block:last-child{margin-bottom:4px}
  .block-title{font-size:13px;font-weight:500;margin-bottom:10px;display:flex;align-items:baseline;gap:8px}
  .block-title .tip{font-size:12px;font-weight:400;color:var(--text-3)}
  .divider{height:1px;background:#f0f1f4;margin:18px -20px}

  /* 指标选择器 */
  .picker{position:relative;flex:1;min-width:0}
  .picker input{
    width:100%;height:34px;padding:0 28px 0 10px;border:1px solid var(--border-input);
    border-radius:6px;outline:none;background:#fff;transition:border .12s, box-shadow .12s;
  }
  .picker input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(47,107,255,.12)}
  .picker .chev{
    position:absolute;right:9px;top:50%;transform:translateY(-50%);
    color:var(--text-3);pointer-events:none;display:flex;
  }
  .picker-list{
    position:absolute;top:38px;left:0;right:0;max-height:216px;overflow-y:auto;
    background:#fff;border:1px solid var(--border);border-radius:8px;
    box-shadow:0 8px 24px rgba(15,23,42,.12);z-index:60;display:none;padding:4px;
  }
  .picker.open .picker-list{display:block}
  .picker-item{
    padding:8px 10px;border-radius:6px;font-size:13px;color:var(--text);cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .picker-item:hover{background:var(--primary-bg);color:var(--primary)}
  .picker-empty{padding:12px;text-align:center;color:var(--text-3);font-size:12px}

  /* 通用小下拉（生成指标时间序列 / 空值处理） */
  .sel{position:relative;width:250px;flex-shrink:0}
  .sel-current{height:34px;border:1px solid var(--border-input);border-radius:6px;background:#fff;display:flex;align-items:center;padding:0 10px;font-size:13px;cursor:pointer;user-select:none;color:var(--text)}
  .sel-current .chev{margin-left:auto;color:var(--text-3);display:flex}
  .sel.open .sel-current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(47,107,255,.12)}
  .sel-panel{position:absolute;top:38px;left:0;min-width:200px;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.12);z-index:70;display:none;padding:4px}
  .sel.open .sel-panel{display:block}
  .sel-item{padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer;position:relative;display:flex;align-items:center;color:var(--text);white-space:nowrap}
  .sel-item:hover{background:var(--primary-bg);color:var(--primary)}
  .sel-item.cur{color:var(--primary);font-weight:500}
  .sel-item .arr{margin-left:auto;color:var(--text-3);font-size:14px}
  .sel-sub{position:absolute;left:calc(100% + 4px);top:-5px;min-width:170px;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:4px;display:none;z-index:71}
  .sel-item.has-sub:hover .sel-sub{display:block}
  .sel-sub .sel-item .chk{width:18px;color:var(--primary);flex-shrink:0}

  /* 问号说明 */
  .q-ic{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#c4c8cf;color:#fff;font-size:11px;cursor:help;vertical-align:-2px;flex-shrink:0}
  .q-ic:hover{background:var(--primary)}
  .q-pop{position:fixed;z-index:300;width:400px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px rgba(15,23,42,.16);padding:14px 16px;font-size:12px;color:var(--text-2);line-height:1.8;display:none}
  .q-pop.show{display:block}
  .q-pop b{color:var(--text)}
  .q-pop .q-note{margin-top:8px;padding-top:8px;border-top:1px solid #f0f1f4;color:var(--text-3)}

  /* 参数行 / 分段行 */
  .param-row,.seg-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .seg-row{align-items:flex-start}
  .seg-row .expr{
    height:auto;min-height:56px;padding:8px 10px;border:1px solid var(--border-input);border-radius:6px;
    outline:none;background:#fff;line-height:1.7;overflow-y:auto;
    font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;word-break:break-word;
  }
  .seg-row .expr:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(47,107,255,.12)}
  .seg-row .expr:empty::before{content:attr(data-ph);color:var(--text-3);pointer-events:none}
  /* @ 参数标签（绿色框） */
  .expr .p-chip{
    display:inline-flex;align-items:center;gap:3px;max-width:180px;vertical-align:-1px;
    background:#e8f8ee;color:#12a150;border:1px solid #b7e6c8;border-radius:5px;
    padding:0 6px;margin:0 1px;font-size:12px;font-weight:600;line-height:18px;
    cursor:default;user-select:none;white-space:nowrap;
  }
  .expr .p-chip .p-name{color:#0f8a43;font-weight:500;overflow:hidden;text-overflow:ellipsis}
  .expr-hint{margin:8px 0 10px;font-size:12px;color:var(--text-3);line-height:1.8}
  .expr-hint code{font-family:"SF Mono",Menlo,Consolas,monospace;color:var(--text-2);background:#f5f6f8;border-radius:4px;padding:1px 6px}

  /* @ 参数提及 */
  .mention-pop{position:fixed;z-index:320;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.14);padding:4px;display:none;max-height:200px;overflow-y:auto}
  .mention-pop.show{display:block}
  .mention-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;font-size:13px;cursor:pointer}
  .mention-item:hover,.mention-item.cur{background:var(--primary-bg);color:var(--primary)}
  .mention-item .m-letter{font-family:"SF Mono",Menlo,monospace;font-weight:700;min-width:14px;flex-shrink:0}
  .mention-item .m-name{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mention-item.cur .m-name{color:var(--primary)}
  .param-tag{
    width:28px;height:28px;border-radius:6px;background:var(--primary-bg);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;
  }
  .seg-row .expr{flex:1.2}
  .seg-row input[type="date"],.seg-row input[type="number"],.date-input,.num-input{
    height:34px;padding:0 10px;border:1px solid var(--border-input);border-radius:6px;outline:none;background:#fff;
  }
  .seg-row input:focus,.date-input:focus,.num-input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(47,107,255,.12)}
  .seg-row .to{color:var(--text-3);font-size:12px;flex-shrink:0}
  .num-input{width:130px}
  .date-input{width:150px}
  .inline-label{font-size:13px;color:var(--text-2);white-space:nowrap}
  .inline-label.req::before{content:"* ";color:#e34d59}
  .form-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .form-row:last-child{margin-bottom:2px}

  /* 单选胶囊组 */
  .pill-group{display:inline-flex;background:#f2f4f7;border-radius:8px;padding:3px;gap:2px}
  .pill input{display:none}
  .pill span{
    display:inline-block;padding:6px 14px;border-radius:6px;font-size:13px;color:var(--text-2);
    cursor:pointer;transition:all .12s;white-space:nowrap;
  }
  .pill input:checked + span{background:#fff;color:var(--primary);font-weight:500;box-shadow:0 1px 3px rgba(15,23,42,.1)}

  /* 分段选项卡（指标拼接） */
  .seg-control{display:inline-flex;background:#f2f4f7;border-radius:8px;padding:3px;gap:2px;margin-bottom:16px}
  .seg-control button{
    border:none;background:none;padding:6px 16px;border-radius:6px;font-size:13px;color:var(--text-2);
  }
  .seg-control button.active{background:#fff;color:var(--primary);font-weight:500;box-shadow:0 1px 3px rgba(15,23,42,.1)}

  /* 公式预览条 */
  .preview-bar{
    display:flex;align-items:center;gap:12px;background:#f7f9ff;border:1px dashed #c8d8fb;
    border-radius:var(--radius-lg);padding:12px 16px;
  }
  .preview-bar .p-label{
    font-size:12px;color:var(--primary);font-weight:600;background:var(--primary-bg);
    border-radius:4px;padding:3px 8px;flex-shrink:0;
  }
  .preview-bar code{
    font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px;color:#3b4252;
    white-space:pre-wrap;word-break:break-all;
  }

  /* 底部 */
  .dlg-footer{
    height:62px;border-top:1px solid var(--border);padding:0 20px;
    display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-shrink:0;background:#fff;
  }
  .dlg-footer .foot-tip{margin-right:auto;font-size:12px;color:var(--text-3)}

  /* Toast */
  .toast{
    position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-16px);
    background:#1f2329;color:#fff;font-size:13px;padding:10px 20px;border-radius:8px;
    opacity:0;visibility:hidden;transition:all .2s;z-index:200;
  }
  .toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#d8dbe0;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#c4c8cf}
</style>
</head>
<body>
<script src="icons.js"></script>

<!-- 背景演示页 -->
<div class="page">
  <header class="topbar">
    <div class="logo">数</div>
    <div class="title">经济数据研究平台</div>
    <div class="crumb">指标库 / 计算指标管理</div>
  </header>
  <div class="page-body">
    <div class="panel">
      <div class="panel-head">
        <h2>计算指标</h2>
        <button class="btn primary" id="openBtn">＋ 添加指标</button>
      </div>
      <table class="fake-table">
        <thead><tr><th>指标名</th><th>计算方式</th><th>单位</th><th>频率</th><th>目录</th><th>更新时间</th></tr></thead>
        <tbody>
          <tr><td>社零同比_移动平均</td><td><span class="tag">N数值移动平均</span></td><td>%</td><td>月频</td><td>国内经济</td><td>2026-07-28</td></tr>
          <tr><td>出口_季调环比</td><td><span class="tag">环比值</span></td><td>%</td><td>月频</td><td>外贸</td><td>2026-07-27</td></tr>
          <tr><td>螺纹钢_指数修匀</td><td><span class="tag">指数修匀</span></td><td>元/吨</td><td>日频</td><td>商品</td><td>2026-07-26</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 统一添加指标弹窗 -->
<div class="overlay show" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true">
    <header class="dlg-header">
      <h1>添加计算指标</h1>
      <span class="sub" id="typeDesc"></span>
      <button class="close" id="closeBtn" title="关闭">✕</button>
    </header>

    <div class="dlg-body">
      <!-- 左侧：计算方式导航 -->
      <aside class="aside">
        <div class="search"><input id="typeSearch" placeholder="搜索计算方式" autocomplete="off"></div>
        <nav id="typeNav"></nav>
      </aside>

      <!-- 右侧：表单 -->
      <main class="main">
        <!-- 公共字段 -->
        <section class="card">
          <h3>基本信息</h3>
          <div class="grid2">
            <div class="field" id="nameField">
              <label class="req">指标名</label>
              <input id="fName" placeholder="请输入计算指标名称" autocomplete="off">
              <div class="hint">建议命名：<span id="nameSug"></span><button id="useSug">使用</button></div>
            </div>
            <div class="field">
              <label class="req">指标单位</label>
              <input id="fUnit" placeholder="如：%、亿元、点、元/吨" autocomplete="off">
            </div>
            <div class="field">
              <label class="req">指标目录</label>
              <select id="fDir">
                <option>宏观研究 / 国内经济</option>
                <option>宏观研究 / 价格指数</option>
                <option>宏观研究 / 外贸</option>
                <option>宏观研究 / 货币金融</option>
                <option>市场数据 / 商品</option>
                <option>市场数据 / 债券</option>
                <option>自定义 / 我的指标</option>
              </select>
            </div>
            <div class="field">
              <label class="req">数据频率</label>
              <select id="fFreq">
                <option>日频</option><option>周频</option>
                <option selected>月频</option><option>季频</option><option>年频</option>
              </select>
            </div>
          </div>
          <div class="field full">
            <label>公式说明</label>
            <textarea id="fDesc" placeholder="说明该指标的计算口径与用途（可自动生成）"></textarea>
            <div class="hint"><button id="genDesc">按当前计算方式自动生成</button></div>
          </div>
        </section>

        <!-- 类型特有参数 -->
        <section class="card">
          <h3>参数配置 <span class="h3-sub" id="paramTypeName"></span></h3>
          <div id="params"></div>
        </section>

        <!-- 公式预览 -->
        <div class="preview-bar">
          <span class="p-label">公式预览</span>
          <code id="preview"></code>
        </div>
      </main>
    </div>

    <footer class="dlg-footer">

/* ---- @ 参数提及（绿色标签框，数据来自上方已选参数） ---- */
var mention = { el:null, node:null, off:-1 };
function mentionItems(){
  var items = [];
  document.querySelectorAll("#opParams .param-row").forEach(function(r){
    var letter = r.querySelector(".param-tag").textContent;
    var input = r.querySelector(".picker input");
    items.push({ letter: letter, name: (input && input.value) ? input.value : ("指标" + letter.toUpperCase()) });
  });
  return items;
}
function closeMention(){
  var pop = document.getElementById("mentionPop");
  if(pop) pop.classList.remove("show");
  mention.el = null; mention.node = null; mention.off = -1;
}
function exprText(el){
  var out = "";
  el.childNodes.forEach(function(n){
    if(n.nodeType === 3) out += n.textContent;
    else if(n.classList && n.classList.contains("p-chip")) out += n.dataset.letter;
    else out += (n.innerText !== undefined ? n.innerText : n.textContent);
  });
  return out;
}
function caretInfo(){
  var sel = window.getSelection();
  if(!sel.rangeCount) return null;
  var range = sel.getRangeAt(0);
  var node = range.startContainer;
  if(node.nodeType !== 3) return null;
  return { node: node, off: range.startOffset };
}
function checkMention(el){
  var ci = caretInfo();
  if(!ci || !el.contains(ci.node)){ closeMention(); return; }
  var before = ci.node.textContent.slice(0, ci.off);
  var at = before.lastIndexOf("@");
  if(at === -1){ closeMention(); return; }
  var kw = before.slice(at + 1);
  if(kw.length > 12 || /[@\s\u00a0+\-*/(),]/.test(kw)){ closeMention(); return; }
  var items = mentionItems().filter(function(it){
    return !kw || it.letter.indexOf(kw.toLowerCase()) > -1 || it.name.toLowerCase().indexOf(kw.toLowerCase()) > -1;
  });
  if(!items.length){ closeMention(); return; }
  mention.el = el; mention.node = ci.node; mention.off = at;
  var pop = document.getElementById("mentionPop");
  pop.innerHTML = items.map(function(it, i){
    return '<div class="mention-item' + (i === 0 ? " cur" : "") + '" data-letter="' + it.letter + '" data-name="' + it.name.replace(/"/g,"&quot;") + '">'
      + '<span class="m-letter">' + it.letter + '</span><span class="m-name">' + it.name + '</span></div>';
  }).join("");
  var r = el.getBoundingClientRect();
  pop.style.left = r.left + "px";
  pop.style.top = (r.bottom + 4) + "px";
  pop.style.width = Math.max(240, r.width * 0.6) + "px";
  pop.classList.add("show");
}
function applyMention(letter, name){
  var el = mention.el, node = mention.node, at = mention.off;
  if(!el || !node) return;
  var ci = caretInfo();
  var end = ci && ci.node === node ? ci.off : node.textContent.length;
  var full = node.textContent;
  var beforeTxt = full.slice(0, at);
  var afterTxt = full.slice(end);
  var chip = document.createElement("span");
  chip.className = "p-chip";
  chip.contentEditable = "false";
  chip.dataset.letter = letter;
  chip.innerHTML = '<span class="p-letter">' + letter + '</span>'
    + (name ? '<span class="p-name">' + name + "</span>" : "");
  var parent = node.parentNode;
  var beforeNode = document.createTextNode(beforeTxt);
  var afterNode = document.createTextNode(afterTxt ? ("\u00a0" + afterTxt) : "\u00a0");
  parent.insertBefore(beforeNode, node);
  parent.insertBefore(chip, node);
  parent.insertBefore(afterNode, node);
  parent.removeChild(node);
  var range = document.createRange();
  range.setStart(afterNode, afterTxt ? 1 : afterNode.textContent.length);
  range.collapse(true);
  var sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
  closeMention();
  el.focus();
  updatePreview();
}

/* ================= 绑定交互 ================= */
var paramsEl = document.getElementById("params");

function bindPickers(root){
  root.querySelectorAll(".picker").forEach(function(p){
    if(p.dataset.bound) return;
    p.dataset.bound = "1";
    var input = p.querySelector("input");
    var list = p.querySelector(".picker-list");
    function render(kw){
      var items = INDICATORS.filter(function(i){ return !kw || i.toLowerCase().indexOf(kw.toLowerCase()) > -1; });
      list.innerHTML = items.length
        ? items.map(function(i){ return '<div class="picker-item">' + i + '</div>'; }).join("")
        : '<div class="picker-empty">无匹配指标</div>';
    }
    input.addEventListener("focus", function(){ render(input.dataset.selected ? "" : input.value); p.classList.add("open"); });
    input.addEventListener("input", function(){ delete input.dataset.selected; render(input.value); p.classList.add("open"); updatePreview(); });
    list.addEventListener("mousedown", function(e){
      var it = e.target.closest(".picker-item");
      if(it){ input.value = it.textContent; input.dataset.selected = "1"; p.classList.remove("open"); updatePreview(); }
    });
  });
}
document.addEventListener("click", function(e){
  document.querySelectorAll(".picker.open,.sel.open").forEach(function(p){ if(!p.contains(e.target)) p.classList.remove("open"); });
});

        t1Series = { mode:"union", param:null };

  var pop = document.getElementById("qPop");
  if(!pop) return;
  var ic = e.target.closest(".q-ic");
  if(ic){
    pop.innerHTML = QTIPS[ic.dataset.q] || "";
    var r = ic.getBoundingClientRect();
    pop.style.left = Math.min(r.left, window.innerWidth - 420) + "px";
    pop.style.top = (r.bottom + 8) + "px";
    pop.classList.add("show");
  }else if(!e.target.closest(".q-pop")){
    pop.classList.remove("show");
  }
});

function bindParams(id){
  bindPickers(paramsEl);

  if(id === 1){
    bindT1Widgets();
    document.getElementById("addParam").addEventListener("click", function(){
      var wrap = document.getElementById("opParams");
      var n = wrap.children.length;
      if(n >= 10){ toast("最多支持 10 个参数"); return; }
      var letter = String.fromCharCode(97 + n);
      wrap.insertAdjacentHTML("beforeend", opParamRow(letter));
      bindPickers(wrap);
    });
    document.getElementById("addSeg").addEventListener("click", function(){
      var wrap = document.getElementById("opSegs");
      if(wrap.children.length >= 5){ toast("最多支持 5 个分段"); return; }
      wrap.insertAdjacentHTML("beforeend", opSegRow());
    });
  }
  if(id === 9){
    var tabs = document.getElementById("t9Tabs");
    tabs.addEventListener("click", function(e){
      var btn = e.target.closest("button"); if(!btn) return;
      tabs.querySelectorAll("button").forEach(function(b){ b.classList.toggle("active", b === btn); });
      document.getElementById("t9-direct").hidden = btn.dataset.tab !== "direct";
      document.getElementById("t9-cum").hidden = btn.dataset.tab !== "cum";
      updatePreview();
    });
  }
  if(id === 16){
    document.getElementById("addDI").addEventListener("click", function(){
      var wrap = document.getElementById("diRows");
      if(wrap.children.length >= 20){ toast("最多支持 20 个子指标"); return; }
      wrap.insertAdjacentHTML("beforeend", diRow());
      bindPickers(wrap);
    });
  }
}

/* 行删除 + 预览联动（事件委托） */
paramsEl.addEventListener("click", function(e){
  var del = e.target.closest(".del-param,.del-seg,.del-di");
  if(del){
    var wrap = del.parentElement.parentElement;
    if(wrap.children.length > 1) del.parentElement.remove();
    else toast("至少保留一行");
    if(wrap.id === "opParams"){ /* 重排参数字母 */
      Array.prototype.forEach.call(wrap.children, function(r, i){
        r.querySelector(".param-tag").textContent = String.fromCharCode(97 + i);
      });
    }
    updatePreview();
  }
});
paramsEl.addEventListener("input", updatePreview);
paramsEl.addEventListener("change", updatePreview);

/* @ 提及事件 */
paramsEl.addEventListener("input", function(e){
  if(e.target.classList && e.target.classList.contains("expr")) checkMention(e.target);
});
paramsEl.addEventListener("keydown", function(e){
  if(!(e.target.classList && e.target.classList.contains("expr"))) return;
  var el = e.target;
  var pop = document.getElementById("mentionPop");
  var showing = pop && pop.classList.contains("show");

  if((e.ctrlKey || e.metaKey) && (e.key === "a" || e.key === "A")){
    e.preventDefault();
    var range = document.createRange();
    range.selectNodeContents(el);
    var s0 = window.getSelection();
    s0.removeAllRanges(); s0.addRange(range);
    return;
  }
  if(e.key === "Enter" && !showing){ e.preventDefault(); return; }

  if(e.key === "Backspace" || e.key === "Delete"){
    var sel = window.getSelection();
    if(!sel.rangeCount) return;
    var range = sel.getRangeAt(0);

    if(!range.collapsed){
      if(range.intersectsNode(el)){
        e.preventDefault();
        el.innerHTML = "";
        placeCaretEnd(el);
        updatePreview();
      }
      return;
    }

    var node = range.startContainer, off = range.startOffset;
    var chip = null;
    if(node === el){
      var idx = off;
      var cand = (e.key === "Backspace") ? el.childNodes[idx - 1] : el.childNodes[idx];
      if(cand && cand.nodeType === 1 && cand.classList.contains("p-chip")) chip = cand;
    }else if(node.nodeType === 3){
      var atStart = (off === 0), atEnd = (off === node.textContent.length);
      var prev = node.previousSibling, next = node.nextSibling;
      if(e.key === "Backspace" && atStart && prev && prev.nodeType === 1 && prev.classList.contains("p-chip")) chip = prev;
      if(e.key === "Delete" && atEnd && next && next.nodeType === 1 && next.classList.contains("p-chip")) chip = next;
      if(!chip && /^[\u00a0 ]?$/.test(node.textContent)){
        if(e.key === "Backspace" && prev && prev.nodeType === 1 && prev.classList.contains("p-chip")) chip = prev;
        if(e.key === "Delete" && next && next.nodeType === 1 && next.classList.contains("p-chip")) chip = next;
      }
    }
    if(chip){
      e.preventDefault();
      var after = chip.nextSibling;
      chip.remove();
      if(after && after.nodeType === 3 && /^[\u00a0 ]+$/.test(after.textContent) && !after.nextSibling){ after.remove(); }
      placeCaretEnd(el);
      updatePreview();
    }
  }
});
function placeCaretEnd(el){
  el.focus();
  var range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  var sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
}
paramsEl.addEventListener("paste", function(e){
  if(e.target.classList && e.target.classList.contains("expr")){
    e.preventDefault();
    var txt = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, txt);
  }
});
paramsEl.addEventListener("keydown", function(e){
  var pop = document.getElementById("mentionPop");
  if(!pop || !pop.classList.contains("show") || !e.target.classList.contains("expr")) return;
  var items = pop.querySelectorAll(".mention-item");
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    var cur = pop.querySelector(".mention-item.cur");
    var idx = Array.prototype.indexOf.call(items, cur);
    idx = e.key === "ArrowDown" ? Math.min(idx + 1, items.length - 1) : Math.max(idx - 1, 0);
    items.forEach(function(x){ x.classList.remove("cur"); });
    if(items[idx]) items[idx].classList.add("cur");
  }else if(e.key === "Enter" || e.key === "Tab"){
    var c = pop.querySelector(".mention-item.cur");
    if(c){ e.preventDefault(); applyMention(c.dataset.letter, c.dataset.name); }
  }else if(e.key === "Escape"){
    closeMention();
  }
});
document.getElementById("mentionPop").addEventListener("mousedown", function(e){
  var it = e.target.closest(".mention-item");
  if(it){ e.preventDefault(); applyMention(it.dataset.letter, it.dataset.name); }
});
document.addEventListener("click", function(e){
  if(!e.target.closest("#mentionPop") && !(e.target.classList && e.target.classList.contains("expr"))) closeMention();
});

/* ================= 公式预览 ================= */
function getX(){
  var p = paramsEl.querySelector(".picker input[data-selected]");
  return p ? p.value : "X";
}
function val(id){ var el = document.getElementById(id); return el && el.value ? el.value : ""; }
function radioVal(name){
  var r = paramsEl.querySelector('input[name="' + name + '"]:checked');
  return r ? r.value : "";
}
function updatePreview(){
  var x = getX(), t = "";
  switch(currentType){
    case 1: {
      var segRows = paramsEl.querySelectorAll("#opSegs .seg-row");
      var lines = [];
      segRows.forEach(function(r){
        var ex = exprText(r.querySelector(".expr")).trim() || "a + b";
        var ds = r.querySelectorAll('input[type="date"]');
        var s = ds[0] && ds[0].value ? ds[0].value : "开始";
        var e = ds[1] && ds[1].value ? ds[1].value : "最新";
        lines.push("y = " + ex + (segRows.length > 1 ? "　[" + s + " ~ " + e + "]" : ""));
      });
      t = lines.join("\n") + "\n（序列：" + (t1Series.mode === "union" ? "所有指标序列并集" : "指定序列") + "，空值处理：" + t1Null + "）";
      break;
    }
    case 2:  t = "y(t) = X(t) − X(t−1)　（累计差分，" + (radioVal("t2_mode") || "转月度") + "）"; break;
    case 3:  t = "y(t) = X(t) ÷ X(t−1) − 1"; break;
    case 4:  t = "y(t) = X(t) − X(t−12)　（同比差值）"; break;
    case 5:  t = "y(t) = MA( X(t), N = " + (val("t5N") || "—") + " )"; break;
    case 6:  t = "y(t) = X(t) ÷ X(t − " + (val("t6N") || "N") + ")"; break;
    case 7:  t = "y(t) = X(t) − X(t − " + (val("t7N") || "N") + ")"; break;
    case 8:  t = "y = 开频(X)，空值处理：" + (radioVal("t8_fill") || "前值填充"); break;
    case 9: {
      var isDirect = !document.getElementById("t9-direct").hidden;
      t = isDirect
        ? "y = t < " + (val("t9Date") || "拼接日") + " ? 前期指标 : 后期指标"
        : "y = 累计拼接(拼接指标)，可比差值 = " + (val("t9Diff") || "0");
      break;
    }
    case 10: t = "y(t) = X(t " + (radioVal("t10_dir") === "滞后" ? "+" : "−") + " " + (val("t10K") || "k") + " 天)"; break;
    case 11: t = "y(t) = X(t " + (radioVal("t11_dir") === "滞后" ? "+" : "−") + " " + (val("t11K") || "k") + " 期)"; break;
    case 12: t = "y = 季节对齐(X, N = " + (val("t12N") || "12") + ", " + (radioVal("t12_cal") || "公历") + ")"; break;
    case 13: t = "ŷ = fit(x, 标准指标)，拟合区间 [" + (val("t13Start") || "开始") + " ~ " + (val("t13End") || "结束") + "]" + (val("t13Lead") ? "，领先 " + val("t13Lead") + " 天" : ""); break;
    case 14: t = "y(t) = X(t) 年化折算"; break;
    case 15: t = "y = 降频(X)，取值方式：" + (radioVal("t15_mode") || "平均值"); break;
    case 16: {
      var n = document.getElementById("diRows").children.length;
      t = "y = mean(x₁…x" + (n > 1 ? "n" : "₁") + ") 相对「母指标」　（" + (radioVal("t16_dates") || "全部日期并集") + "）";
      break;
    }
    case 17: t = "y(t) = Σ X(1…t)，最新值处理：" + (radioVal("t17_mode") || "默认"); break;
    case 18: { var a = val("t18a") || "α"; t = "y(t) = " + a + "·X(t) + (1 − " + a + ")·y(t−1)"; break; }
    case 19: t = "y(t) = X(t) ÷ 当期天数"; break;
  }
  document.getElementById("preview").textContent = t.replace(/X/g, x === "X" ? "X" : "「" + x + "」");
  updateNameHint();
}
function updateNameHint(){
  var type = TYPES.find(function(t){ return t.id === currentType; });
  var x = getX();
  document.getElementById("nameSug").textContent = (x === "X" ? "原指标" : x.split(":")[0]) + "_" + type.name;
}

/* ================= 左侧导航 ================= */
function buildNav(kw){
  var nav = document.getElementById("typeNav");
  var html = "";
  GROUP_ORDER.forEach(function(g){
    var items = TYPES.filter(function(t){ return t.group === g && (!kw || t.name.indexOf(kw) > -1); });
    if(!items.length) return;
    html += '<div class="nav-group"><div class="g-title">' + g + '</div>';
    items.forEach(function(t){
      html += '<button class="nav-item' + (t.id === currentType ? " active" : "") + '" data-id="' + t.id + '" title="' + t.desc + '">'
        + '<span class="no">' + t.id + '</span><span>' + t.name + '</span></button>';
    });
    html += '</div>';
  });
  nav.innerHTML = html || '<div class="nav-empty">未找到匹配的计算方式</div>';
}
document.getElementById("typeNav").addEventListener("click", function(e){
  var item = e.target.closest(".nav-item");
  if(item) selectType(+item.dataset.id);
});
document.getElementById("typeSearch").addEventListener("input", function(e){ buildNav(e.target.value.trim()); });

function selectType(id){
  currentType = id;
  var type = TYPES.find(function(t){ return t.id === id; });
  document.querySelectorAll(".nav-item").forEach(function(n){ n.classList.toggle("active", +n.dataset.id === id); });
  document.getElementById("typeDesc").textContent = type.name + " · " + type.desc;
  document.getElementById("paramTypeName").textContent = "（" + type.name + "）";
  paramsEl.innerHTML = paramsHTML(id);
  bindParams(id);
  updatePreview();
}

/* ================= 弹窗开关 & 提交 ================= */
var overlay = document.getElementById("overlay");
function openDlg(){ overlay.classList.add("show"); }
function closeDlg(){ overlay.classList.remove("show"); }
document.getElementById("openBtn").addEventListener("click", openDlg);
document.getElementById("closeBtn").addEventListener("click", closeDlg);
document.getElementById("cancelBtn").addEventListener("click", closeDlg);
overlay.addEventListener("click", function(e){ if(e.target === overlay) closeDlg(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeDlg(); });

document.getElementById("okBtn").addEventListener("click", function(){
  var name = document.getElementById("fName");
  if(!name.value.trim()){
    document.getElementById("nameField").classList.add("error");
    name.focus();
    toast("请填写指标名");
    return;
  }
  document.getElementById("nameField").classList.remove("error");
  var type = TYPES.find(function(t){ return t.id === currentType; });
  toast("已保存（原型演示）：" + name.value.trim() + " · " + type.name);
  closeDlg();
});
document.getElementById("fName").addEventListener("input", function(){
  document.getElementById("nameField").classList.remove("error");
});
document.getElementById("useSug").addEventListener("click", function(){
  document.getElementById("fName").value = document.getElementById("nameSug").textContent;
  document.getElementById("nameField").classList.remove("error");
});
document.getElementById("genDesc").addEventListener("click", function(){
  var type = TYPES.find(function(t){ return t.id === currentType; });
  var x = getX();
  document.getElementById("fDesc").value =
    "对「" + (x === "X" ? "基础指标" : x) + "」执行" + type.name + "计算。" + type.desc + "。计算口径详见公式预览。";
});

/* Toast */
var toastTimer;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2200);
}

/* ================= 初始化 ================= */
buildNav("");
selectType(1);
</script>
