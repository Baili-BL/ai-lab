<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图库 · AILab AI指标工坊</title>
<script src="g2.min.js"></script>
<style>
  :root{
    --primary:#1664FF; --primary-hover:#0E4FE6; --primary-bg:#E8F3FF;
    --text:#1D2129; --text-2:#4E5969; --text-3:#86909C;
    --border:#E5E6EB; --border-input:#D9D9E0;
    --bg:#F2F3F5; --card:#ffffff; --danger:#e34d59; --success:#12b76a;
    --radius:8px; --radius-lg:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit;font-size:13px;color:var(--text)}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#d8dbe0;border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:#c4c8cf}

  .btn{
    height:34px;padding:0 18px;border-radius:6px;border:1px solid var(--border-input);
    background:#fff;color:var(--text);font-size:13px;transition:all .15s;
  }
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-hover);color:#fff}

  .app{display:flex;height:100vh;background:var(--bg)}
  .sidebar{
    width:196px;background:transparent;border-right:none;
    display:flex;flex-direction:column;flex-shrink:0;transition:width .2s ease;
  }
  .logo{
    height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:none;
  }
  .logo .brand-mark{
    width:28px;height:28px;border-radius:7px;flex-shrink:0;display:block;object-fit:contain;
  }
  .logo .name{font-weight:700;font-size:14px;color:var(--text);letter-spacing:-.02em;white-space:nowrap}
  .logo .sub{font-size:12px;color:var(--text-3);white-space:nowrap;font-weight:400}
  .menu{flex:1;overflow-y:auto;padding:8px}
  .menu-item{
    width:100%;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;margin-bottom:4px;
    border:none;background:none;border-radius:8px;cursor:pointer;font-size:14px;color:var(--text);text-align:left;
    font-weight:400;line-height:40px;transition:background .15s,color .15s;
  }
  .menu-item:hover{background:#e8e9eb;color:var(--text)}
  .menu-item:active{background:#e8e8f0}
  .menu-item.active{background:var(--primary-bg);color:var(--primary);font-weight:500}
  .menu-item .mi-icon{display:flex;flex-shrink:0;align-items:center;justify-content:center;width:15px;height:15px;color:inherit}
  .menu-item .mi-icon svg{display:block}
  .menu-item .mi-arrow{margin-left:auto;color:var(--text-3);display:flex;transition:transform .15s}
  .menu-item.expanded .mi-arrow{transform:rotate(180deg)}
  .sub-menu{display:none;padding:0 0 4px}
  .sub-menu.open{display:block}
  .sub-item{
    width:100%;display:flex;align-items:center;height:36px;padding:0 12px 0 37px;margin-bottom:2px;
    border:none;background:none;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-2);text-align:left;
    transition:background .15s,color .15s;
  }
  .sub-item:hover{background:#e8e9eb;color:var(--text)}
  .sub-item.active,.sub-item.on{background:var(--primary-bg);color:var(--primary);font-weight:500}
  .sub-item .sd{display:none}

  .sidebar-foot{
    flex-shrink:0;padding:8px 12px;
    display:flex;align-items:center;
  }
  .sb-collapse{
    width:32px;height:32px;border:none;border-radius:6px;background:transparent;
    color:var(--text-2);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;
  }
  .sb-collapse:hover{background:#e8e9eb;color:var(--text)}
  .app.nav-collapsed .sidebar{width:56px;overflow:visible;z-index:40}
  .app.nav-collapsed .logo{justify-content:center;padding:0 8px}
  .app.nav-collapsed .logo .name,
  .app.nav-collapsed .logo .sub{display:none}
  .app.nav-collapsed .menu{padding:8px 6px;overflow:visible}
  .app.nav-collapsed .menu-item{
    justify-content:center;padding:0;gap:0;font-size:0;line-height:0;overflow:visible;position:relative;
  }
  .app.nav-collapsed .menu-item .mi-icon{font-size:14px;line-height:1}
  .app.nav-collapsed .menu-item .mi-arrow,
  .app.nav-collapsed .sub-menu,
  .app.nav-collapsed .sub-item .cnt{display:none !important}
  .app.nav-collapsed .sidebar-foot{justify-content:center;padding:8px;overflow:visible;position:relative}
  .app.nav-collapsed .sb-collapse{position:relative}
  .app.nav-collapsed .sb-collapse svg{transform:scaleX(-1)}
  .app.nav-collapsed .menu-item[data-tip]::after,
  .app.nav-collapsed .sb-collapse[data-tip]::after{
    content:attr(data-tip);
    position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);
    background:#fff;color:var(--text);font-size:13px;font-weight:400;line-height:20px;
    padding:6px 12px;border:1px solid var(--border);border-radius:6px;
    box-shadow:0 4px 14px rgba(15,23,42,.10);white-space:nowrap;pointer-events:none;
    opacity:0;visibility:hidden;z-index:80;
  }
  .app.nav-collapsed .menu-item[data-tip]::before,
  .app.nav-collapsed .sb-collapse[data-tip]::before{
    content:"";position:absolute;left:calc(100% + 5px);top:50%;width:8px;height:8px;
    background:#fff;border-left:1px solid var(--border);border-bottom:1px solid var(--border);
    transform:translateY(-50%) rotate(45deg);pointer-events:none;
    opacity:0;visibility:hidden;z-index:81;
  }
  .app.nav-collapsed .menu-item[data-tip]:hover::after,
  .app.nav-collapsed .menu-item[data-tip]:hover::before,
  .app.nav-collapsed .sb-collapse[data-tip]:hover::after,
  .app.nav-collapsed .sb-collapse[data-tip]:hover::before{
    opacity:1;visibility:visible;
  }

  .workspace{flex:1;display:flex;flex-direction:column;min-width:0}

  .content,.bench{
    background:#fff;
    border-top-left-radius:16px;
  }

  .topbar{
    height:52px;background:transparent;border-bottom:none;flex-shrink:0;
    display:flex;align-items:center;gap:14px;padding:0 20px;
  }
  .topbar .crumb{font-size:14px}
  .topbar .crumb b{font-weight:600}
  .topbar .crumb .sep{color:var(--text-3);margin:0 8px}
  .topbar .crumb .cur{color:var(--text);font-weight:500}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px}
  .lang-btn{
    height:30px;padding:0 14px;border-radius:6px;border:1px solid var(--border-input);
    background:#fff;font-size:12px;color:var(--text-2);
  }
  .bell{border:none;background:none;color:var(--text-2);display:flex;padding:6px;border-radius:6px;position:relative}
  .bell:hover{background:#f7f7f9}
  .bell .dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:1.5px solid #fff}
  .user{display:flex;align-items:center;gap:8px;border:none;background:none;padding:4px 6px;border-radius:8px}
  .user:hover{background:#f7f7f9}
  .user .avatar{
    width:30px;height:30px;border-radius:50%;background:#ebebf5;color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
  }
  .user .uname{font-size:13px;color:var(--text)}

  .content{flex:1;min-height:0;display:flex;padding:16px;gap:14px}

  /* ---------- 左：目录面板（对齐指标中心） ---------- */
  .dir-panel{
    width:300px;flex-shrink:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:16px;display:flex;flex-direction:column;position:relative;max-height:100%;
    transition:width .2s ease,padding .2s ease,border-color .2s;
  }
  .dir-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .dir-head h2{font-size:15px}
  .dir-head .only-mine{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);cursor:pointer;user-select:none}
  .dir-head .only-mine input{accent-color:var(--primary)}
  .dir-search{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .dir-search .ds-input{
    flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--border-input);
    border-radius:6px;padding:0 10px;height:32px;background:#fff;
  }
  .dir-search .ds-input:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px rgba(82,82,255,.16)}
  .dir-search .ds-input input{flex:1;border:none;outline:none;height:100%;min-width:0;background:transparent}
  .dir-search .ds-input svg{color:var(--text-3);flex-shrink:0}
  .dir-search .exact{
    display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2);
    white-space:nowrap;cursor:pointer;user-select:none;flex-shrink:0;
  }
  .switch{position:relative;display:inline-block;width:34px;height:19px;flex-shrink:0}
  .switch input{display:none}
  .switch .sl{
    position:absolute;inset:0;background:#d4d7de;border-radius:19px;transition:.15s;cursor:pointer;
  }
  .switch .sl::after{
    content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
    background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(15,23,42,.2);
  }
  .switch input:checked + .sl{background:var(--primary)}
  .switch input:checked + .sl::after{transform:translateX(15px)}

  .dir-tree{flex:1;overflow-y:auto;margin:0 -6px;min-height:0}
  .dir-item{
    display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:6px;font-size:13px;
    color:var(--text);cursor:pointer;user-select:none;position:relative;
  }
  .dir-item:hover{background:#f7f7f9}
  .dir-item.active{background:var(--primary-bg);color:var(--text);font-weight:500}
  .dir-item.drop-on{background:#e8e8f5;outline:1.5px dashed var(--primary);outline-offset:-2px}
  body.is-chart-dragging .dir-item{cursor:copy}
  .dir-item.dt-leaf{font-size:12.5px;font-weight:400}
  .dir-item.dt-leaf .di-icon{opacity:.75}
  .dir-item.dt-leaf[draggable="true"]{cursor:grab}
  body.is-chart-dragging .dir-item[data-path]{cursor:copy}
  .dir-item .di-arrow{color:var(--text-3);display:flex;transition:transform .12s;flex:none}
  .dir-item.open .di-arrow{transform:rotate(90deg)}
  .dir-item .di-icon{color:var(--text-2);display:flex;flex-shrink:0}
  .dir-item.active .di-icon{color:var(--text)}
  .dir-item:not(.dt-leaf) .di-icon{color:unset}
  .dir-item .di-icon svg{display:block}
  .dir-item .di-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
  .dir-item .di-cnt{font-size:11px;color:var(--text-3);flex-shrink:0}
  .dir-item .di-ops{display:none;align-items:center;gap:2px;margin-left:4px;flex-shrink:0}
  .dir-item:hover .di-ops,.dir-item.active .di-ops{display:flex}
  .dir-item:hover .di-cnt,.dir-item.active .di-cnt{display:none}
  .di-ops button{
    width:22px;height:22px;border:none;background:transparent;border-radius:4px;
    color:#5b8def;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;
  }
  .di-ops button:hover{background:rgba(82,82,255,.16)}
  .di-ops button.danger{color:#f53f3f}
  .di-ops button.danger:hover{background:#fdf0f1}
  .dir-item .di-plus{
    width:18px;height:18px;border-radius:4px;display:none;align-items:center;justify-content:center;
    color:var(--text-3);font-size:13px;line-height:1;flex:none;border:none;background:none;padding:0;cursor:pointer;
  }
  .dir-item:hover .di-plus,.dir-item.active .di-plus{display:inline-flex}
  .dir-item .di-plus:hover{background:var(--primary);color:#fff}
  .dir-children{margin-left:22px;display:none}
  .dir-children.open{display:block}
  .dir-foot{border-top:1px solid #f0f1f4;padding-top:10px;margin-top:10px;display:flex;flex-direction:column;gap:2px}
  .dir-foot button{
    display:flex;align-items:center;gap:8px;border:none;background:none;padding:7px 10px;border-radius:6px;
    font-size:13px;color:var(--text);text-align:left;
  }
  .dir-foot button:hover{background:#f4f6f9;color:var(--primary)}
  .dir-toggle{
    position:absolute;top:50%;right:-13px;transform:translateY(-50%);z-index:30;
    width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--border);
    box-shadow:0 2px 8px rgba(15,23,42,.12);color:var(--text-3);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .dir-toggle:hover{color:var(--primary);border-color:var(--primary)}
  .dir-toggle svg{transition:transform .2s}
  .dir-panel.collapsed{width:0;padding:0;border-color:transparent;overflow:visible}
  .dir-panel.collapsed > *:not(.dir-toggle){display:none}
  .dir-panel.collapsed .dir-toggle svg{transform:rotate(180deg)}

  /* ---------- 右：图表网格 ---------- */
  .gallery-panel{
    flex:1;min-width:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .gal-head{
    padding:12px 18px;font-size:13px;color:var(--text-2);flex-shrink:0;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #f0f1f4;
    position:relative;z-index:20;overflow:visible;
  }
  .gal-head .gal-count{flex-shrink:0}
  .gal-head .gal-count b{color:var(--primary);font-weight:600}
  .gi-search{
    margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--border-input);
    border-radius:6px;padding:0 10px;height:32px;width:210px;background:#fff;flex-shrink:0;
  }
  .gi-search input{flex:1;border:none;outline:none;height:100%;min-width:0;background:transparent}
  .gi-search svg{color:var(--text-3);flex-shrink:0}
  .gi-search:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px rgba(82,82,255,.16)}
  .gal-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .gal-head .btn-add-chart{
    height:34px;padding:0 16px;border:none;border-radius:6px;
    background:var(--primary);color:#fff;font-size:13px;font-weight:500;
    display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
  }
  .gal-head .btn-add-chart:hover{background:var(--primary-hover)}
  .gi-date{position:relative;z-index:1}
  .gi-date.open{z-index:30}
  .gi-date-btn{
    display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:6px;
    border:1px solid var(--border-input);background:#fff;font-size:12.5px;color:var(--text-2);
    white-space:nowrap;transition:all .15s;
  }
  .gi-date-btn:hover{border-color:var(--primary);color:var(--primary)}
  .gi-date-btn svg{color:var(--text-3);flex-shrink:0}
  .gi-date-btn:hover svg{color:var(--primary)}
  .gi-date-btn.on{border-color:var(--primary);color:var(--primary);background:var(--primary-bg);font-weight:500}
  .gi-date-btn.on svg{color:var(--primary)}
  .gi-date-pop{
    position:absolute;top:calc(100% + 6px);left:0;right:auto;width:280px;background:#fff;z-index:80;
    border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px rgba(15,23,42,.16);
    padding:14px;display:none;
  }
  .gi-date-pop.show{display:block}
  .gdp-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .gdp-row label{font-size:12.5px;color:var(--text-2);width:56px;flex-shrink:0}
  .gdp-row input{
    flex:1;min-width:0;height:30px;border:1px solid var(--border-input);border-radius:6px;
    padding:0 8px;font-size:12.5px;outline:none;background:#fff;color:var(--text);
  }
  .gdp-row input:focus{border-color:var(--primary)}
  .gdp-quick{display:flex;gap:6px;margin:2px 0 12px}
  .gdp-quick button{
    flex:1;height:26px;border:1px solid var(--border-input);background:#fff;border-radius:5px;
    font-size:12px;color:var(--text-2);
  }
  .gdp-quick button:hover{border-color:var(--primary);color:var(--primary)}
  .gdp-actions{display:flex;justify-content:flex-end;gap:8px}
  .gdp-actions .btn{height:30px;padding:0 14px;font-size:12.5px}
  .gal-scroll{flex:1;overflow-y:auto;padding:16px 16px 8px;min-height:0;position:relative;z-index:0}
  /* 固定 4 列，避免 auto-fill 末行留缝 / 卡片被拉宽 */
  .gal-grid{
    display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:16px;
    align-content:start;
  }
  @media (max-width:1280px){
    .gal-grid{grid-template-columns:repeat(3, minmax(0, 1fr))}
  }
  @media (max-width:980px){
    .gal-grid{grid-template-columns:repeat(2, minmax(0, 1fr))}
  }
  .chart-card{
    background:#fff;border:1px solid var(--border);border-radius:10px;overflow:visible;
    box-shadow:0 1px 2px rgba(15,23,42,.03);transition:box-shadow .15s,border-color .15s;
    display:flex;flex-direction:column;cursor:pointer;min-width:0;width:100%;
  }
  .chart-card:hover{border-color:#d4d4ea;box-shadow:0 8px 22px rgba(15,23,42,.06);z-index:2}
  .chart-card.dragging{opacity:.45}
  .cc-title{
    padding:10px 14px 2px;font-size:14px;font-weight:600;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;
    border-radius:10px 10px 0 0;line-height:1.35;
  }
  .cc-mini-legend{
    flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;
    gap:6px 14px;padding:4px 14px 0;min-height:22px;max-height:44px;overflow:hidden;
  }
  .cc-mini-legend:empty{display:none;padding:0;min-height:0}
  .cc-mini-legend .mlg-item{
    display:inline-flex;align-items:center;gap:5px;max-width:92%;
    font-size:12px;line-height:1.25;color:#1D2129;font-weight:500;min-width:0;
  }
  .cc-mini-legend .mlg-name{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
  }
  .cc-mini-legend .mlg-line{
    width:22px;height:3px;border:none;border-radius:1px;flex-shrink:0;
    background:currentColor;
  }
  .cc-mini-legend .mlg-sq{
    width:10px;height:10px;border-radius:2px;flex-shrink:0;
  }
  .cc-mini-legend .mlg-dot{
    width:8px;height:8px;border-radius:50%;flex-shrink:0;
  }
  .cc-preview{
    height:168px;padding:0;background:#fff;overflow:hidden;position:relative;
  }
  .chart-card.is-full .cc-title,
  .chart-card.is-full .cc-mini-legend{display:none}
  .chart-card.is-full .cc-preview{height:208px}
  /* 预览区原尺寸绘制，由 G2 autoFit 适配，不整体 CSS 缩放（避免坐标轴被缩小） */
  .cc-scale-host{
    position:absolute;inset:0;width:100%;height:100%;
  }
  .cc-g2{width:100%;height:100%}
  .cc-preview-frame{
    width:100%;height:100%;border:0;display:block;background:#fff;
    opacity:0;transition:opacity .2s ease;pointer-events:none;
  }
  .cc-scale-host.is-ready .cc-preview-frame{opacity:1;pointer-events:auto}
  .cc-boot{
    position:absolute;inset:0;z-index:2;
    display:flex;align-items:center;justify-content:center;
    background:#fff;opacity:0;transition:opacity .2s ease;pointer-events:none;
  }
  .cc-boot .load-box{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    color:var(--text-3);font-size:12px;
  }
  .cc-boot .load-spin{
    width:22px;height:22px;border:2.5px solid #dbe4f8;border-top-color:var(--primary);
    border-radius:50%;animation:ccSpin .7s linear infinite;
  }
  @keyframes ccSpin{to{transform:rotate(360deg)}}
  .cc-scale-host.is-loading .cc-boot{opacity:1}
  .cc-scale-host.is-ready .cc-boot{opacity:0;pointer-events:none}
  .cc-thumb{
    width:100%;height:100%;display:block;object-fit:contain;object-position:center;
    background:#fff;pointer-events:none;
  }
  .cc-g2-fallback,.cc-empty{
    height:100%;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--text-3);letter-spacing:.02em;
  }
  .cc-foot{
    margin-top:auto;padding:9px 14px;border-top:1px solid #f0f1f4;background:#fafbfc;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    overflow:visible;position:relative;z-index:1;border-radius:0 0 10px 10px;
  }
  .cc-date{font-size:12px;color:var(--text-3)}
  .cc-acts{display:flex;align-items:center;gap:0;flex-shrink:0;overflow:visible}
  .cc-fav{
    position:relative;
    box-sizing:content-box;
    width:16px;height:16px;padding:4px;margin:0 0 0 16px;
    border:none;border-radius:4px;background:#fff;
    color:rgba(0,0,0,.15);
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;line-height:0;
  }
  .cc-fav:hover{background:rgba(0,0,0,.04);color:rgba(0,0,0,.45)}
  .cc-fav.on{color:#FAAD14;background:#fff}
  .cc-fav.on:hover{color:#FFC53D;background:rgba(0,0,0,.04)}
  .cc-fav svg{width:16px;height:16px;display:block}
  .cc-fav-tip{
    position:absolute;left:50%;top:calc(100% + 10px);
    transform:translateX(-50%);
    padding:6px 10px;border-radius:6px;
    background:rgba(0,0,0,.85);color:#fff;
    font-size:12px;line-height:18px;white-space:nowrap;font-weight:400;
    opacity:0;visibility:hidden;pointer-events:none;
    z-index:30;transition:opacity .12s ease;
  }
  .cc-fav-tip::before{
    content:"";
    position:absolute;left:50%;bottom:100%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-bottom:6px solid rgba(0,0,0,.85);
  }
  .cc-fav:hover .cc-fav-tip{opacity:1;visibility:visible}
  .gal-chart-tip{
    position:fixed;z-index:80;display:none;box-sizing:border-box;
    background:#fff;border-radius:2px;padding:8px 10px;
    color:rgba(0,0,0,.85);font-size:12px;line-height:18px;
    pointer-events:none;max-width:280px;
    filter:drop-shadow(0 0 0.5px rgba(0,0,0,.12)) drop-shadow(0 6px 16px rgba(0,0,0,.12));
  }
  .gal-chart-tip.show{display:block}
  .gal-chart-tip .cb-tip{min-width:140px}
  .gal-chart-tip .cb-tip-title{color:rgba(0,0,0,.45);margin-bottom:2px;font-size:12px;line-height:18px}
  .gal-chart-tip .cb-tip-row{display:flex;align-items:center;justify-content:space-between;gap:16px;line-height:22px}
  .gal-chart-tip .cb-tip-name{display:flex;align-items:center;gap:6px;min-width:0;max-width:240px}
  .gal-chart-tip .cb-tip-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gal-chart-tip .cb-tip-val{flex-shrink:0;color:rgba(0,0,0,.85)}
  .gal-chart-tip .cb-tip-shape{display:inline-flex;align-items:center;justify-content:center;width:10px;height:10px;flex-shrink:0;line-height:0}
  .gal-chart-tip .cb-tip-shape svg{width:10px;height:10px;display:block}
  .gal-chart-tip .cb-tip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .gal-chart-tip .cb-tip-sq{width:8px;height:8px;border-radius:1.5px;flex-shrink:0}
  .gal-chart-tip .cb-tip-line{width:14px;height:2.5px;border-radius:1px;flex-shrink:0}
  .gal-empty{
    grid-column:1 / -1;padding:80px 20px;text-align:center;color:var(--text-3);font-size:13px;line-height:1.7;
  }
  .gal-pager{
    flex-shrink:0;display:flex;justify-content:flex-end;align-items:center;gap:6px;
    padding:12px 16px;border-top:1px solid #f0f1f4;background:#fff;font-size:13px;color:var(--text-2);
  }
  .gal-pager button{
    min-width:30px;height:30px;border:1px solid var(--border-input);border-radius:6px;background:#fff;
    color:var(--text-2);font-size:13px;padding:0 8px;cursor:pointer;
  }
  .gal-pager button.cur{background:var(--primary);border-color:var(--primary);color:#fff}
  .gal-pager button:hover:not(.cur):not(:disabled){border-color:var(--primary);color:var(--primary)}
  .gal-pager button:disabled{opacity:.45;cursor:not-allowed}
  .gal-pager .pg-info{margin-right:auto;font-size:12.5px;color:var(--text-3)}
  .gal-pager .pg-info b{color:var(--primary);font-weight:600}

  .toast{
    position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-16px);
    background:#fff;color:#1f2329;font-size:13px;padding:11px 16px 11px 14px;border-radius:12px;
    opacity:0;visibility:hidden;transition:all .2s;z-index:400;display:flex;align-items:center;gap:10px;
    box-shadow:0 10px 32px rgba(36,48,72,.14);border:1px solid #e8ebf2;max-width:min(480px,92vw);
  }
  .toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  .toast .t-ico{
    width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
    font-size:14px;background:#eaf0ff;
  }

  /* 目录增删改弹窗 */
  .modal-mask{
    position:fixed;inset:0;background:rgba(36,48,72,.28);z-index:100;
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transition:opacity .18s;backdrop-filter:blur(2px);
  }
  .modal-mask.show{opacity:1;visibility:visible}
  .modal{
    background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 18px 48px rgba(36,48,72,.14);max-height:88vh;
  }
  .modal-head{
    min-height:56px;background:linear-gradient(180deg,#f7f9ff 0%,#ffffff 100%);
    color:var(--text);display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid #eef1f6;
  }
  .modal-head .mh-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
  .modal-head .mh-ico{
    width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;
    background:#eaf0ff;color:var(--primary);
  }
  .modal-head .mh-ico.danger{background:#fef0f1;color:#e34d59}
  .modal-head .mh-x{
    margin-left:auto;width:30px;height:30px;border:none;background:none;border-radius:8px;color:var(--text-3);cursor:pointer;
  }
  .modal-head .mh-x:hover{background:#eef1f6;color:var(--text)}
  .modal-body{padding:18px 20px;background:#fcfdff}
  .modal-foot{
    padding:12px 20px;border-top:1px solid #eef1f6;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;
  }
  .btn.tint{background:var(--primary-bg);border-color:transparent;color:var(--primary)}
  .btn.tint:hover{background:#e0e0f5}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.danger:hover{background:#c93645;color:#fff}
  .df-form{display:flex;flex-direction:column;gap:18px;padding:8px 4px 4px}
  .df-row{display:flex;align-items:center;gap:14px}
  .df-row > label{width:72px;flex-shrink:0;text-align:right;font-size:13px;color:var(--text)}
  .df-row > .df-val{flex:1;font-size:13px;color:var(--text);min-height:22px;word-break:break-all}
  .df-row > input,.df-row > select{
    flex:1;height:36px;border:1px solid var(--border-input);border-radius:4px;padding:0 12px;
    font-size:13px;color:var(--text);outline:none;background:#fff;
  }
  .df-row > input:focus,.df-row > select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(82,82,255,.16)}
  .df-note{margin:-4px 0 0 86px;font-size:12px;color:var(--text-3);line-height:1.5}
  .df-row > label .req{color:var(--danger);margin-right:2px;font-style:normal;font-weight:500}

  /* 保存到图库：盖住全屏图表抽屉 */
  #saveChartMask{z-index:320}
  #saveChartMask .modal{overflow:visible}
  #saveChartMask .modal-body{overflow:visible}
  .sc-path{position:relative;flex:1;min-width:0}
  .sc-path-btn{
    width:100%;height:36px;border:1px solid var(--border-input);border-radius:4px;
    background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:0 10px 0 12px;font-size:13px;color:var(--text);cursor:pointer;text-align:left;
  }
  .sc-path-btn:hover{border-color:var(--primary)}
  .sc-path.open .sc-path-btn{border-color:var(--primary);box-shadow:0 0 0 2px rgba(82,82,255,.16)}
  .sc-path-btn .sc-path-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sc-path-btn .sc-path-txt.ph{color:var(--text-3)}
  .sc-path-btn svg{color:var(--text-3);flex-shrink:0}
  .sc-path-panel{
    display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:12;
    background:#fff;border:1px solid var(--border);border-radius:8px;
    box-shadow:0 8px 24px rgba(15,23,42,.12);max-height:280px;overflow-y:auto;padding:4px;
  }
  .sc-path.open .sc-path-panel{display:block}
  .sc-path-item{
    display:flex;align-items:center;gap:6px;min-height:32px;padding:4px 10px;border-radius:6px;
    font-size:13px;color:var(--text);cursor:pointer;line-height:1.3;
  }
  .sc-path-item:hover{background:#f4f6f9}
  .sc-path-item.on{background:var(--primary-bg);color:var(--primary);font-weight:500}
  .sc-path-item .sc-depth{flex:none;width:0}

  /* 批量移动图表 */
  #batchMask .modal{overflow:visible}
  #batchMask .modal-body{overflow:visible}
  .bm-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .bm-row{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);
    border-radius:8px;font-size:13px;color:var(--text);
  }
  .bm-row input{accent-color:var(--primary);width:15px;height:15px;flex:none}
  .bm-row .bm-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bm-row .bm-dir{color:var(--text-3);font-size:12px;flex:none}
  .bm-select{
    display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid #f0f1f4;
  }
  .bm-select > label{font-size:13px;color:var(--text-2);white-space:nowrap}
  .bm-summary{font-size:12.5px;color:var(--text-3)}
  .modal-foot .foot-left{margin-right:auto;font-size:12.5px;color:var(--text-3)}

  /* ---------- 新建图表 · 右侧抽屉（整屏模糊遮罩；面板从侧栏右侧起） ---------- */
  .builder-drawer-root{
    position:fixed;inset:0;z-index:260;
    pointer-events:none;visibility:hidden;
  }
  .builder-drawer-root.open{pointer-events:auto;visibility:visible}
  .builder-drawer-mask{
    position:absolute;inset:0;
    background:rgba(15,23,42,.28);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;transition:opacity .22s ease;
  }
  .builder-drawer-root.open .builder-drawer-mask{opacity:1}
  .builder-drawer{
    position:absolute;top:0;right:0;bottom:0;left:0;
    width:100vw;max-width:100%;
    background:var(--bg);display:flex;flex-direction:column;
    box-shadow:none;overflow:hidden;
    opacity:0;transition:opacity .12s ease;
  }
  .builder-drawer-root.open .builder-drawer{opacity:1}
  .builder-drawer-root.open .builder-drawer-mask{opacity:0;pointer-events:none}
  .builder-drawer-root.fullscreen .builder-drawer-mask{opacity:0;pointer-events:none}
  .builder-drawer-root.fullscreen .builder-drawer{
    width:100vw;max-width:100%;left:0;right:0;box-shadow:none;
  }
  .builder-drawer iframe{
    flex:1;width:100%;height:100%;border:0;background:var(--bg);display:block;
    opacity:0;transition:opacity .16s ease;
  }
  .builder-drawer-root.is-ready iframe{opacity:1}
  .builder-boot{
    position:absolute;inset:0;z-index:2;background:var(--bg);
    opacity:0;transition:opacity .16s ease;
    pointer-events:none;
    display:flex;align-items:center;justify-content:center;
  }
  .builder-boot .load-box{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    color:var(--text-3);font-size:13px;
  }
  .builder-boot .load-spin{
    width:28px;height:28px;border:2.5px solid #dbe4f8;border-top-color:var(--primary);
    border-radius:50%;animation:ccSpin .7s linear infinite;
  }
  .builder-drawer-root.is-loading .builder-boot{opacity:1}
  .builder-drawer-root.is-ready .builder-boot{opacity:0}
</style>
</head>

<script>
var ME = "吴开文";
var DIR_TREE = [
  { name:"期权", children:["股指期权","商品期权"] },
  { name:"PVC", children:["现货","基差","库存"] },
  { name:"烧碱", children:["现货","开工率"] },
  { name:"PE", children:["线性","高压","低压"] },
  { name:"PP", children:["拉丝","共聚","基差"] },
  { name:"丙烯", children:["现货","价差"] },
  { name:"钢材", children:["螺纹","热卷","中厚板"] },
  { name:"沪铜", children:["主力","基差","库存"] },
  { name:"沪锌", children:["主力","基差"] },
  { name:"双焦", children:["焦炭","焦煤"] },
  { name:"铝链", children:["电解铝","氧化铝","预焙阳极"] }
];
var DIR_EDIT_CTX = null;
var DIR_ADD_PARENT = "";
var DIR_DEL_PATH = "";
var gridDir = "";
var gridItemId = "";
var DIR_EXP = {};
var PENDING_SAVE = null;
var EDITING_CHART_ID = "";
var RESTORE_CHART = null;
var BUILDER_FRAME_READY = false;

var COLORS = [
  ["#2f6bff","#e34d59","#12b76a"],
  ["#c8102e","#1a3a6b","#d4a017"],
  ["#7b61ff","#f2994a","#56ccf2"],
  ["#27ae60","#eb5757","#2f6bff"],
  ["#e8734a","#6478c8","#4ecf9f"]
];

function hashStr(s){
  var h = 0;
  for(var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function rndSeries(seed, n, base, amp){
  var out = [], v = base;
  for(var i = 0; i < n; i++){
    seed = (seed * 9301 + 49297) % 233280;
    v += ((seed / 233280) - 0.48) * amp;
    out.push(Math.round(v * 10) / 10);
  }
  return out;
}

var galG2 = {};
var galTipPtr = { x: 0, y: 0 };
function galEsc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function showGalChartTip(html, x, y){
  var tip = document.getElementById("galChartTip");
  if(!tip) return;
  if(!html){
    tip.classList.remove("show");
    tip.innerHTML = "";
    return;
  }
  tip.classList.add("show");
  tip.innerHTML = html;
  var pad = 14;
  var left = x + pad;
  var top = y + pad;
  var tw = tip.offsetWidth || 160;
  var th = tip.offsetHeight || 48;
  if(left + tw > window.innerWidth - 8) left = x - tw - 8;
  if(top + th > window.innerHeight - 8) top = y - th - 8;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}
function hideGalChartTip(){
  showGalChartTip("", 0, 0);
}
function iframeClientToPage(iframe, x, y){
  if(!iframe) return { x: x, y: y };
  var rect = iframe.getBoundingClientRect();
  var iw = iframe.offsetWidth || 720;
  var ih = iframe.offsetHeight || 400;
  return {
    x: rect.left + x * (rect.width / iw),
    y: rect.top + y * (rect.height / ih)
  };
}
function destroyGalG2(){
  hideGalChartTip();
  document.querySelectorAll(".cc-preview-frame").forEach(function(f){
    try{ f.src = "about:blank"; }catch(e){}
  });
  Object.keys(galG2).forEach(function(id){
    try{ galG2[id].destroy(); }catch(e){}
  });
  galG2 = {};
}
function miniLegends(seed, kind){
  var cols = COLORS[seed % COLORS.length];
  if(kind === "plastic") return [["L2509", "#2f6bff"], ["基差", "#e34d59"], ["月差", "#12b76a"]];
  if(kind === "pp") return [["PP主力", "#c8102e"], ["基差", "#1a3a6b"], ["月差", "#d4a017"]];
  if(kind === "pig") return [["鲜冻价差", "#7b61ff"], ["出栏均价", "#f2994a"]];
  return [["系列A", cols[0]], ["系列B", cols[1]], ["系列C", cols[2]]];
}
function miniChartType(seed, kind){
  if(kind === "plastic" || kind === "pp") return "line";
  if(kind === "pig") return "area";
  return ["line", "area", "col"][seed % 3];
}
function miniFlatData(seed, kind, n){
  var legends = miniLegends(seed, kind);
  var flat = [];
  legends.forEach(function(L, si){
    var vals = rndSeries(seed + 11 + si * 19, n, 36 + si * 10, 5 + si);
    vals.forEach(function(v, i){
      flat.push({ x: String(i + 1), i: i, value: v, name: L[0] });
    });
  });
  return { flat: flat, names: legends.map(function(L){ return L[0]; }), colors: legends.map(function(L){ return L[1]; }) };
}
function miniTypeFromSaved(type){
  if(type === "pie") return "pie";
  if(type === "stackColPercent") return "stackColPercent";
  if(type === "stackAreaPercent") return "stackAreaPercent";
  if(type === "stackCol") return "stackCol";
  if(type === "stackArea") return "stackArea";
  if(type === "area") return "area";
  if(type === "bar" || type === "col" || type === "column" || type === "hbar") return "col";
  return "line";
}
function downsampleArr(arr, n){
  arr = arr || [];
  if(arr.length <= n) return arr.slice();
  var out = [];
  for(var i = 0; i < n; i++){
    out.push(arr[Math.round(i * (arr.length - 1) / (n - 1))]);
  }
  return out;
}
function packFromSnapshot(snap){
  var series = (snap && snap.series) || [];
  var n = 42;
  var flat = [], names = [], colors = [];
  series.forEach(function(s){
    var name = s.alias || s.name || "系列";
    names.push(name);
    colors.push(s.color || "#2f6bff");
    downsampleArr(s.data || [], n).forEach(function(v, i){
      if(v == null || !isFinite(+v)) return;
      flat.push({ x: String(i + 1), i: i, value: +v, name: name });
    });
  });
  return { flat: flat, names: names, colors: colors, unit: (snap && snap.unit) || "" };
}
function packFromBuilder(st){
  if(!st || !st.series || !st.series.length) return null;
  var s0 = (st.time && st.time.s) || 0;
  var e0 = (st.time && st.time.e);
  var pack = packFromSnapshot({
    type: st.type,
    unit: (st.series[0] && st.series[0].unit) || "",
    series: st.series.map(function(sr){
      var data = sr.data || [];
      var end = e0 != null ? e0 : (data.length ? data.length - 1 : 0);
      return { name: sr.alias || sr.name, color: sr.color, data: data.slice(s0, end + 1) };
    })
  });
  return pack;
}
function miniYLabel(v){
  var n = Number(v);
  if(!isFinite(n)) return "";
  var a = Math.abs(n);
  if(a >= 1e8) return (n / 1e8).toFixed(a >= 1e9 ? 0 : 1).replace(/\.0$/, "") + "亿";
  if(a >= 1e4) return (n / 1e4).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "万";
  if(a >= 1000) return Math.round(n).toLocaleString("zh-CN");
  if(Math.abs(n - Math.round(n)) < 1e-6) return String(Math.round(n));
  return String(Math.round(n * 10) / 10);
}
/* 与详情页一致的时间轴：23/01 */
function miniMonthLabel(i, n){
  var lo = 2023 * 12;      /* 2023-01 */
  var hi = 2026 * 12 + 6;  /* 2026-07 */
  var t = n <= 1 ? 0 : i / (n - 1);
  var m = Math.round(lo + t * (hi - lo));
  var yy = Math.floor(m / 12) % 100;
  var mo = (m % 12) + 1;
  return (yy < 10 ? "0" + yy : "" + yy) + "/" + (mo < 10 ? "0" + mo : "" + mo);
}
function fitMiniScale(host){
  if(!host) return;
  host.style.width = "100%";
  host.style.height = "100%";
  host.style.transform = "none";
  var frame = host.querySelector("iframe");
  if(frame && frame.contentWindow){
    try{ frame.contentWindow.postMessage({ type: "chart-builder-preview-reflow" }, "*"); }catch(e){}
  }
}
function hasFullBuilder(c){
  return !!(c && c.builderState && c.builderState.series && c.builderState.series.length);
}
function pushStateToPreview(frame, c){
  if(!frame || !frame.contentWindow || !c || !c.builderState) return;
  try{
    frame.contentWindow.postMessage({
      type: "chart-builder-restore",
      id: c.id || "",
      title: c.title || "",
      state: c.builderState
    }, "*");
  }catch(e){}
}
function markPreviewReady(host){
  if(!host) return;
  if(host._bootTimer){ clearTimeout(host._bootTimer); host._bootTimer = null; }
  if(host._loadTimer){ clearTimeout(host._loadTimer); host._loadTimer = null; }
  host.classList.remove("is-loading");
  host.classList.add("is-ready");
}
function armPreviewBoot(host){
  if(!host) return;
  host.classList.remove("is-ready", "is-loading");
  if(host._bootTimer) clearTimeout(host._bootTimer);
  if(host._loadTimer) clearTimeout(host._loadTimer);
  host._loadTimer = setTimeout(function(){
    host._loadTimer = null;
    if(!host.classList.contains("is-ready")) host.classList.add("is-loading");
  }, 3000);
  host._bootTimer = setTimeout(function(){ markPreviewReady(host); }, 12000);
}
function mountBuilderPreview(c){
  var host = document.getElementById("pv-" + c.id);
  if(!host) return;
  host.classList.add("is-full");
  fitMiniScale(host);
  var frame = host.querySelector("iframe");
  if(!frame) return;
  var start = function(){
    if(frame.dataset.loaded === "1") return;
    frame.dataset.loaded = "1";
    armPreviewBoot(host);
    frame.src = "chart-builder.html?drawer=1&preview=1&edit=1";
  };
  frame.addEventListener("mouseleave", hideGalChartTip);
  if(typeof IntersectionObserver === "function"){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(!en.isIntersecting) return;
        io.disconnect();
        start();
      });
    }, { root: document.querySelector(".gal-scroll"), rootMargin: "120px", threshold: 0.01 });
    io.observe(host);
  } else {
    start();
  }
}
function paintMiniLegend(c, pack, type){
  var box = document.getElementById("lg-" + c.id);
  if(!box) return;
  if(!pack || !pack.names || !pack.names.length){
    box.innerHTML = "";
    return;
  }
  var useLine = type === "line" || type === "area" || type === "stackArea" || type === "stackAreaPercent";
  var useSq = type === "col" || type === "stackCol" || type === "stackColPercent" || type === "pie";
  box.innerHTML = pack.names.map(function(nm, i){
    var color = pack.colors[i] || "#2f6bff";
    var mark = useLine
      ? '<span class="mlg-line" style="background:' + color + ';color:' + color + '"></span>'
      : useSq
        ? '<span class="mlg-sq" style="background:' + color + '"></span>'
        : '<span class="mlg-dot" style="background:' + color + '"></span>';
    var label = String(nm).replace(/</g, "&lt;");
    return '<span class="mlg-item" title="' + label + '">' + mark
      + '<span class="mlg-name">' + label + "</span></span>";
  }).join("");
}
function miniTooltipHtml(info, type, xLabel, isPct){
  var items = (info && info.items) || [];
  var title = (info && info.title) || "";
  if(!title && items[0]){
    var d0 = items[0].data || items[0].datum || {};
    title = type === "pie" ? (d0.name || items[0].name || "") : xLabel(d0.i);
  }
  var rows = items.map(function(it){
    var d = it.data || it.datum || {};
    var name = d.name || it.name || "";
    var raw = d.value != null ? d.value : it.value;
    var text;
    if(isPct) text = Math.round(Number(raw) * 100) + "%";
    else if(typeof raw === "string") text = raw;
    else text = miniYLabel(raw);
    var color = it.color || "#2f6bff";
    return '<div class="cb-tip-row"><span class="cb-tip-name">'
      + '<span class="cb-tip-dot" style="background:' + galEsc(color) + '"></span>'
      + '<span class="cb-tip-label">' + galEsc(name) + "</span></span>"
      + '<span class="cb-tip-val">' + galEsc(text) + "</span></div>";
  }).join("");
  if(!rows && !title) return "";
  return '<div class="cb-tip">'
    + (title ? '<div class="cb-tip-title">' + galEsc(title) + "</div>" : "")
    + rows + "</div>";
}
function applyMiniTooltip(chart, host, type, xLabel, isPct){
  if(!chart) return;
  chart.interaction("tooltip", false);
}
function paintMiniChart(c){
  if(hasFullBuilder(c)){
    mountBuilderPreview(c);
    return;
  }
  var elId = "g2-" + c.id;
  var el = document.getElementById(elId);
  if(!el || typeof G2 === "undefined") return;
  if(galG2[c.id]){
    try{ galG2[c.id].destroy(); }catch(e){}
    delete galG2[c.id];
  }
  el.innerHTML = "";
  var type, pack, unit = "";
  if(c.snapshot && c.snapshot.series && c.snapshot.series.length){
    type = miniTypeFromSaved(c.snapshot.type);
    pack = packFromSnapshot(c.snapshot);
    unit = pack.unit || c.snapshot.unit || "";
  } else if(c.builderState && c.builderState.series && c.builderState.series.length){
    type = miniTypeFromSaved(c.builderState.type);
    pack = packFromBuilder(c.builderState);
    unit = (pack && pack.unit) || "";
    if(!unit){
      var s0 = c.builderState.series[0];
      unit = (s0 && s0.unit) || "";
    }
  } else {
    type = miniChartType(c.seed, c.kind);
    pack = miniFlatData(c.seed, c.kind, type === "col" ? 8 : 36);
  }
  if(!pack || !pack.flat.length){
    el.innerHTML = '<div class="cc-empty">没有数据</div>';
    return;
  }
  paintMiniLegend(c, pack, type);
  var host = el.closest(".cc-scale-host") || el.parentNode;
  fitMiniScale(host);
  var xMax = 0;
  pack.flat.forEach(function(d){ if(d.i > xMax) xMax = d.i; });
  function xLabel(v){
    var i = Number(v);
    if(!isFinite(i)) return "";
    return miniMonthLabel(i, xMax + 1);
  }
  var chart = new G2.Chart({
    container: elId,
    autoFit: true,
    paddingLeft: 44,
    paddingRight: 10,
    paddingTop: unit ? 28 : 8,
    paddingBottom: 36,
    margin: 0,
    theme: "light",
    animation: false
  });
  var colorScale = { domain: pack.names, range: pack.colors };
  var isPct = type === "stackColPercent" || type === "stackAreaPercent";
  var axisX = {
    title: false,
    label: true,
    labelFontSize: 12,
    labelFill: "#4E5969",
    labelFormatter: xLabel,
    size: 36,
    transform: [
      { type: "rotate", optionalAngles: [0, 45, 90], recoverWhenFailed: true },
      { type: "hide", keepHeader: true, keepTail: true }
    ],
    tick: true,
    tickCount: 5,
    tickStroke: "#C9CDD4",
    tickLength: 4,
    line: true,
    lineStroke: "#C9CDD4",
    lineLineWidth: 1,
    grid: false
  };
  var axisY = {
    title: !!unit,
    titleText: unit || "",
    titleFontSize: 12,
    titleFill: "#4E5969",
    titleSpacing: 8,
    label: true,
    labelFontSize: 12,
    labelFill: "#4E5969",
    labelFormatter: isPct
      ? function(v){ return Math.round(+v * 100) + "%"; }
      : miniYLabel,
    tick: false,
    tickCount: 6,
    nice: true,
    line: true,
    lineStroke: "#C9CDD4",
    lineLineWidth: 1,
    grid: true,
    gridStroke: "#E5E6EB",
    gridLineWidth: 1,
    gridLineDash: []
  };
  var yScale = { nice: true, tickCount: 6 };
  var xScaleNum = { tickCount: 5 };
  var noLegend = false;
  if(type === "pie"){
    var pieRows = pack.names.map(function(nm, i){
      var last = pack.flat.filter(function(d){ return d.name === nm; }).pop();
      return { name: nm, value: last ? last.value : 1, color: pack.colors[i] };
    });
    chart.interval()
      .coordinate({ type: "theta", outerRadius: 0.78 })
      .data(pieRows)
      .transform({ type: "stackY" })
      .encode("y", "value")
      .encode("color", "name")
      .scale("color", colorScale)
      .legend(noLegend);
  } else if(type === "col" || type === "stackCol" || type === "stackColPercent"){
    var colMark = chart.interval()
      .data(pack.flat)
      .encode("x", "i")
      .encode("y", "value")
      .encode("color", "name")
      .scale("color", colorScale)
      .scale("x", xScaleNum)
      .scale("y", yScale)
      .style("maxWidth", 18)
      .axis("x", axisX)
      .axis("y", axisY)
      .legend(noLegend);
    if(type === "stackColPercent"){
      colMark.transform([{ type: "stackY" }, { type: "normalizeY" }]);
      colMark.scale("y", { domain: [0, 1], tickCount: 5 });
    } else if(type === "stackCol"){
      colMark.transform({ type: "stackY" });
    } else {
      colMark.encode("series", "name").transform({ type: "dodgeX" });
    }
  } else if(type === "area" || type === "stackArea" || type === "stackAreaPercent"){
    var areaMark = chart.area()
      .data(pack.flat)
      .encode("x", "i")
      .encode("y", "value")
      .encode("color", "name")
      .encode("series", "name")
      .style("fillOpacity", 0.18)
      .style("shape", "smooth")
      .scale("color", colorScale)
      .scale("x", xScaleNum)
      .scale("y", yScale)
      .axis("x", axisX)
      .axis("y", axisY)
      .legend(noLegend);
    var areaLine = chart.line()
      .data(pack.flat)
      .encode("x", "i")
      .encode("y", "value")
      .encode("color", "name")
      .encode("series", "name")
      .style("lineWidth", 2)
      .style("shape", "smooth")
      .scale("color", colorScale)
      .scale("x", xScaleNum)
      .scale("y", yScale)
      .axis(false)
      .legend(false)
      .tooltip(false);
    if(type === "stackAreaPercent"){
      areaMark.transform([{ type: "stackY" }, { type: "normalizeY" }]);

function matchText(s, kw, exact){
  if(!kw) return true;
  var a = (s || "").toLowerCase();
  var b = kw.toLowerCase();
  return exact ? a === b : a.indexOf(b) > -1;
}
function chartDirPath(c){ return c.dir || ""; }
function dirCntOf(path){
  if(!path) return CHARTS.length;
  return CHARTS.filter(function(c){
    var p = chartDirPath(c);
    var top = p.split("/")[0];
    return p === path || p.indexOf(path + "/") === 0 || path === top;
  }).length;
}
function dirChildName(c){ return typeof c === "string" ? c : c.name; }
function dirChildKids(c){ return c && typeof c === "object" ? (c.children || null) : null; }
function dirNormChild(arr, idx){
  if(typeof arr[idx] === "string") arr[idx] = { name: arr[idx], children: [] };
  if(!arr[idx].children) arr[idx].children = [];
  return arr[idx];
}
function dirLocate(path){
  if(!path) return null;
  var parts = path.split("/");
  var topIdx = DIR_TREE.findIndex(function(d){ return d.name === parts[0]; });
  if(topIdx < 0) return null;
  if(parts.length === 1) return { node: DIR_TREE[topIdx], container: DIR_TREE, index: topIdx };
  var container = DIR_TREE[topIdx].children;
  if(!container) return null;
  var node = null, index = -1;
  for(var i = 1; i < parts.length; i++){
    index = -1;
    for(var j = 0; j < container.length; j++){
      if(dirChildName(container[j]) === parts[i]){ index = j; node = container[j]; break; }
    }
    if(index < 0) return null;
    if(i < parts.length - 1){
      dirNormChild(container, index);
      container = container[index].children;
    }
  }
  return { node: node, container: container, index: index };
}
function dirAddUnder(parentPath, name){
  if(!parentPath){
    if(DIR_TREE.some(function(d){ return d.name === name; })) return { ok:false, msg:"已存在同名一级目录" };
    DIR_TREE.push({ name: name });
    return { ok:true, path: name };
  }
  var parts = parentPath.split("/");
  var top = DIR_TREE.find(function(d){ return d.name === parts[0]; });
  if(!top) return { ok:false, msg:"上级目录不存在" };
  if(!top.children) top.children = [];
  var container = top.children;
  for(var i = 1; i < parts.length; i++){
    var idx = -1;
    for(var j = 0; j < container.length; j++){
      if(dirChildName(container[j]) === parts[i]){ idx = j; break; }
    }
    if(idx < 0) return { ok:false, msg:"上级目录不存在" };
    dirNormChild(container, idx);
    container = container[idx].children;
  }
  if(container.some(function(c){ return dirChildName(c) === name; })){
    return { ok:false, msg:"该目录下已存在同名子目录" };
  }
  container.push(name);
  return { ok:true, path: parentPath + "/" + name };
}

function renderDirFolder(name, path, kids, iconSize){
  var leaves = itemsInDir(path);

function renderPager(total){

  var start = total ? (gridPage - 1) * PAGE_SIZE + 1 : 0;
  var end = Math.min(gridPage * PAGE_SIZE, total);
  var nums = [];
  if(pages <= 7){
    for(var i = 1; i <= pages; i++) nums.push(i);
  }else{
    nums.push(1);
    var L = Math.max(2, gridPage - 1), R = Math.min(pages - 1, gridPage + 1);
    if(L > 2) nums.push("…");
    for(var j = L; j <= R; j++) nums.push(j);
    if(R < pages - 1) nums.push("…");
    nums.push(pages);
  }
  var html = '<span class="pg-info">第 <b>' + (total ? gridPage : 0) + '</b> / ' + pages + ' 页，显示 ' + start + '-' + end + ' / 共 ' + total + ' 条</span>';
  html += '<button type="button" data-pg="prev"' + (gridPage <= 1 || !total ? " disabled" : "") + '>‹</button>';
  nums.forEach(function(n){

document.getElementById("deOk").addEventListener("click", function(){
  if(!DIR_EDIT_CTX) return;
  var name = document.getElementById("deName").value.trim();
  if(!name){ toast("请填写目录名称"); return; }
  if(/[\/\\]/.test(name)){ toast("目录名称不能包含斜杠"); return; }
  var oldPath = DIR_EDIT_CTX.path;
  if(DIR_EDIT_CTX.level === "top"){
    var node = DIR_TREE[DIR_EDIT_CTX.topIdx];
    if(!node){ toast("目录不存在"); return; }
    if(name !== node.name && DIR_TREE.some(function(d){ return d.name === name; })){
      toast("已存在同名一级目录"); return;
    }
    node.name = name;
    CHARTS.forEach(function(c){
      if(c.dir === oldPath) c.dir = name;
      else if(c.dir.indexOf(oldPath + "/") === 0) c.dir = name + c.dir.slice(oldPath.length);
    });
    if(gridDir === oldPath) gridDir = name;
    else if(gridDir.indexOf(oldPath + "/") === 0) gridDir = name + gridDir.slice(oldPath.length);
  }else{
    var loc = DIR_EDIT_CTX.loc || dirLocate(oldPath);
    if(!loc){ toast("目录不存在"); return; }
    var conflict = loc.container.some(function(c, i){
      return i !== loc.index && dirChildName(c) === name;
    });
    if(conflict){ toast("同级已存在同名目录"); return; }
    var cur = loc.container[loc.index];
    if(typeof cur === "string") loc.container[loc.index] = name;
    else cur.name = name;
    var newPath = oldPath.split("/").slice(0, -1).concat([name]).join("/");
    CHARTS.forEach(function(c){
      if(c.dir === oldPath) c.dir = newPath;
      else if(c.dir.indexOf(oldPath + "/") === 0) c.dir = newPath + c.dir.slice(oldPath.length);
    });
    if(gridDir === oldPath) gridDir = newPath;
    else if(gridDir.indexOf(oldPath + "/") === 0) gridDir = newPath + gridDir.slice(oldPath.length);
  }
  closeMask("dirEditMask");
  DIR_EDIT_CTX = null;
  refresh();
  persistGallery();
  toast("目录已保存");
});

    });
  }
  if(data.type === "chart-builder-preview-tooltip"){
    var tipFrame = null;
    document.querySelectorAll(".cc-preview-frame").forEach(function(f){
      if(f.contentWindow === e.source) tipFrame = f;
    });
    if(!data.show){
      hideGalChartTip();
      return;
    }
    var pt = iframeClientToPage(tipFrame, data.x || 0, data.y || 0);
    showGalChartTip(data.html || "", pt.x, pt.y);
  }
  if(data.type === "chart-builder-preview-tooltip-move"){
    var moveFrame = null;
    document.querySelectorAll(".cc-preview-frame").forEach(function(f){
      if(f.contentWindow === e.source) moveFrame = f;
    });
    var tip = document.getElementById("galChartTip");
    if(!moveFrame || !tip || !tip.classList.contains("show")) return;
    var mp = iframeClientToPage(moveFrame, data.x || 0, data.y || 0);
    showGalChartTip(tip.innerHTML, mp.x, mp.y);
  }
  if(data.type === "chart-builder-preview-click"){
    hideGalChartTip();
    document.querySelectorAll(".cc-preview-frame").forEach(function(f){
      if(f.contentWindow !== e.source) return;
      var card = f.closest(".chart-card");
      if(!card) return;
      var hit = CHARTS.filter(function(c){ return c.id === card.dataset.id; })[0];
      if(hit) openBuilderDrawer(hit);
    });
  }
  if(data.type === "chart-builder-restored"){
    var fromPreview = false;
    document.querySelectorAll(".cc-preview-frame").forEach(function(f){
      if(f.contentWindow !== e.source) return;
      fromPreview = true;
      var host = f.closest(".cc-scale-host");
      fitMiniScale(host);
      markPreviewReady(host);
    });
    if(!fromPreview) markBuilderReady();
  }
  if(data.type === "chart-builder-reset-done"){
    markBuilderReady();
  }
  if(data.type === "chart-builder-saved"){
    toast("图表「" + (data.title || "") + "」已保存到图库");
  }
});
document.getElementById("galPager").addEventListener("click", function(e){
  var b = e.target.closest("button[data-pg]");
  if(!b || b.disabled) return;
  var total = filteredCharts().length;
  var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  var pg = b.dataset.pg;
  if(pg === "prev") gridPage = Math.max(1, gridPage - 1);
  else if(pg === "next") gridPage = Math.min(pages, gridPage + 1);
  else gridPage = +pg;
  renderGallery();
  var scroll = document.querySelector(".gal-scroll");
  if(scroll) scroll.scrollTop = 0;
});

var giDateBtn = document.getElementById("giDateBtn");

  var wrap = document.getElementById("giDate");

    if(wrap) wrap.classList.add("open");

});
document.getElementById("gdpOk").addEventListener("click", function(){
  state.dateFrom = document.getElementById("gdpFrom").value || "";
  state.dateTo = document.getElementById("gdpTo").value || "";
  if(state.dateFrom && state.dateTo && state.dateFrom > state.dateTo){
    var tmp = state.dateFrom; state.dateFrom = state.dateTo; state.dateTo = tmp;
  }
  setGiDatePopOpen(false);
  giDateLabel();

});
document.getElementById("gdpReset").addEventListener("click", function(){
  document.getElementById("gdpFrom").value = "";
  document.getElementById("gdpTo").value = "";
  state.dateFrom = "";
  state.dateTo = "";
  giDateLabel();
  setGiDatePopOpen(false);
  renderGallery({ resetPage: true });
});

document.getElementById("galGrid").addEventListener("click", function(e){
  var fav = e.target.closest("[data-fav]");
  if(fav){
    e.stopPropagation();
    var id = fav.dataset.fav;
    var hit = CHARTS.filter(function(c){ return c.id === id; })[0];
    if(!hit) return;
    if(hit.inMine){
      hit.inMine = false;
      hit.mine = false;
      renderGallery();
      toast("已取消收藏「" + hit.title + "」");
    } else {
      hit.inMine = true;
      hit.mine = true;
      renderGallery();
      toast("已添加收藏「" + hit.title + "」");
    }
    return;
  }
  var card = e.target.closest(".chart-card");
  if(card){
    var hit = CHARTS.filter(function(c){ return c.id === card.dataset.id; })[0];
    openBuilderDrawer(hit);
  }
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    var saveOpen = document.getElementById("saveChartMask") && document.getElementById("saveChartMask").classList.contains("show");
    if(saveOpen){
      if(document.getElementById("scPath") && document.getElementById("scPath").classList.contains("open")){
        closeScPathPanel();
        return;
      }
      closeMask("saveChartMask");
      return;
    }
    var batchOpen = document.getElementById("batchMask") && document.getElementById("batchMask").classList.contains("show");
    if(batchOpen){
      if(document.getElementById("bmPath") && document.getElementById("bmPath").classList.contains("open")){
        closeBmPathPanel();
        return;
      }
      closeMask("batchMask");
      return;
    }
    if(document.getElementById("builderDrawer")?.classList.contains("open")){
      closeBuilderDrawer();
      return;
    }
    closeMask("dirAddMask"); closeMask("dirEditMask"); closeMask("dirDelMask");
    setGiDatePopOpen(false);
  }
});

giDateLabel();
refresh();
ensureBuilderFrame();
document.getElementById("draftMenuArrow").addEventListener("click", function(e){
  e.stopPropagation();
  document.getElementById("menuDraftsNav").classList.toggle("expanded");
  document.getElementById("draftSubMenu").classList.toggle("open");
});

<script>
(function(){
  var menu = document.querySelector(".sidebar .menu");
  if(!menu || menu.dataset.volcBound === "1") return;
  menu.dataset.volcBound = "1";
  menu.addEventListener("click", function(e){
    if(e.target.closest(".mi-arrow")) return;
    var sub = e.target.closest(".sub-item");
    if(sub && menu.contains(sub)){
      var wrap = sub.parentElement;
      if(wrap) wrap.querySelectorAll(".sub-item").forEach(function(b){ b.classList.remove("active","on"); });
      sub.classList.add("active");
      menu.querySelectorAll(":scope > .menu-item").forEach(function(b){ b.classList.remove("active"); });
      var prev = wrap && wrap.previousElementSibling;
      if(prev && prev.classList.contains("menu-item")) prev.classList.add("active");
      return;
    }
    var item = e.target.closest(".menu-item");
    if(!item || !menu.contains(item) || item.closest(".sub-menu")) return;
    menu.querySelectorAll(":scope > .menu-item").forEach(function(b){ b.classList.remove("active"); });
    item.classList.add("active");
  });
})();
</script>

<script>
(function(){
  var app = document.querySelector(".app");
  if(!app) return;
  document.querySelectorAll(".sidebar .menu-item").forEach(function(b){
    if(b.getAttribute("data-tip")) return;
    var t = "";
    b.childNodes.forEach(function(n){ if(n.nodeType === 3) t += n.textContent; });
    t = t.replace(/\s+/g, " ").trim();
    if(t) b.setAttribute("data-tip", t);
  });
  document.querySelectorAll(".sb-collapse").forEach(function(b){
    if(!b || b.dataset.navBound === "1") return;
    b.dataset.navBound = "1";
    if(!b.getAttribute("data-tip")) b.setAttribute("data-tip", "展开菜单");
    b.addEventListener("click", function(){
      app.classList.toggle("nav-collapsed");
      b.setAttribute("data-tip", app.classList.contains("nav-collapsed") ? "展开菜单" : "收起菜单");
    });
  });
})();

window.addEventListener("resize", function(){
  hideGalChartTip();
  clearTimeout(_galScaleTimer);
  _galScaleTimer = setTimeout(function(){
    document.querySelectorAll(".cc-scale-host").forEach(function(host){

      if(!ch || typeof ch.changeSize !== "function") return;

    });
  }, 80);
});
